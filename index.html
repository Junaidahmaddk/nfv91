<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Fairhomes · Business case</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Tema-tokens. Tripler bruges til rgba(...) med alpha; solids til rene farver.
         Mørkt er default; [data-theme="light"] vender dem. Alt andet i appen peger
         herind, så et temaskift ikke kræver ændringer i komponenterne. */
      :root {
        --bg-rgb: 15,38,38;
        --ink-rgb: 232,220,196;
        --card-rgb: 43,59,54;
        --gold-rgb: 212,197,169;
        --teal-rgb: 54,120,120;
        --gr-rgb: 34,197,94;
        --or-rgb: 245,158,11;
        --bg: #0F2626;
        --bg-alt: #16302f;
        --gold: #D4C5A9;
        --teal: #367878;
        --gr: #22C55E;
        --rd: #EF4444;
        --or: #F59E0B;
        --amber-text: #E8C989;
        --shadow: rgba(0,0,0,0.5);
        --ink-08: rgba(var(--ink-rgb),0.104);
        --ink-1: rgba(var(--ink-rgb),0.13);
        --ink-12: rgba(var(--ink-rgb),0.156);
        --ink-15: rgba(var(--ink-rgb),0.195);
        --ink-2: rgba(var(--ink-rgb),0.26);
        --ink-25: rgba(var(--ink-rgb),0.325);
        --ink-3: rgba(var(--ink-rgb),0.39);
        --ink-35: rgba(var(--ink-rgb),0.637);
        --ink-4: rgba(var(--ink-rgb),0.7);
        --ink-45: rgba(var(--ink-rgb),0.762);
        --ink-5: rgba(var(--ink-rgb),0.825);
        --ink-55: rgba(var(--ink-rgb),0.887);
        --ink-6: rgba(var(--ink-rgb),0.95);
        --ink-7: rgba(var(--ink-rgb),0.95);
        --ink-75: rgba(var(--ink-rgb),0.95);
        --ink-8: rgba(var(--ink-rgb),0.95);
        --ink-85: rgba(var(--ink-rgb),0.95);
        color-scheme: dark;
      }
      [data-theme="light"] {
        --bg-rgb: 252,250,246;
        --ink-rgb: 28,48,46;
        --card-rgb: 206,197,180;
        --gold-rgb: 132,110,70;
        --teal-rgb: 38,96,96;
        --gr-rgb: 21,122,58;
        --or-rgb: 176,106,8;
        --bg: #FCFAF6;
        --bg-alt: #F1ECE1;
        --gold: #846E46;
        --teal: #266060;
        --gr: #157A3A;
        --rd: #C02626;
        --or: #B06A08;
        --amber-text: #7A5A0C;
        --shadow: rgba(40,30,10,0.14);
        --ink-08: rgba(var(--ink-rgb),0.128);
        --ink-1: rgba(var(--ink-rgb),0.16);
        --ink-12: rgba(var(--ink-rgb),0.192);
        --ink-15: rgba(var(--ink-rgb),0.24);
        --ink-25: rgba(var(--ink-rgb),0.512);
        --ink-3: rgba(var(--ink-rgb),0.575);
        --ink-35: rgba(var(--ink-rgb),0.637);
        --ink-4: rgba(var(--ink-rgb),0.7);
        --ink-45: rgba(var(--ink-rgb),0.762);
        --ink-5: rgba(var(--ink-rgb),0.825);
        --ink-55: rgba(var(--ink-rgb),0.887);
        --ink-6: rgba(var(--ink-rgb),0.95);
        --ink-7: rgba(var(--ink-rgb),0.95);
        --ink-75: rgba(var(--ink-rgb),0.95);
        --ink-8: rgba(var(--ink-rgb),0.95);
        --ink-85: rgba(var(--ink-rgb),0.95);
        color-scheme: light;
      }
      body { margin: 0; background: var(--bg); transition: background 120ms linear; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
